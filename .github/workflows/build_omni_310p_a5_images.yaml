# TEMPORARY workflow: build vllm-omni images for Ascend 310p / A5.
#
# Upstream vllm-omni has no 310p/a5 NPU Dockerfiles yet, so the Dockerfiles
# live in this repo for now (docker/vllm-omni/Dockerfile.npu.ci.{310p,a5}) and
# clone vllm-omni at build time. Once upstream ships docker/Dockerfile.npu.310p
# and docker/Dockerfile.npu.a5, delete this workflow and those Dockerfiles and
# add the variants to the omni matrix in build_images.yaml instead.
#
# The builds reuse the standard multi-arch pipeline (_build_push_image.yaml)
# with THIS repo as the checkout/build context, FROM the matching vllm-ascend
# variant tag (<vllm_ascend_base_tag>-310p / -a5).
#
# Published tags:
#   vllm-omni: <vllm_ascend_base_tag>-omni-<omni_ref>[-310p|-a5]
name: Build Omni 310p/A5 images (temporary)

on:
  workflow_dispatch:
    inputs:
      omni_ref:
        description: 'vllm-omni ref to clone into the image (branch/tag/commit, or a PR ref like refs/pull/123/head)'
        type: string
        default: 'main'
      vllm_ascend_image:
        description: 'Base vllm-ascend image repo (FROM)'
        type: string
        default: 'quay.io/fayeomni/vllm-ascend'
      vllm_ascend_base_tag:
        description: 'vllm-ascend tag WITHOUT the variant suffix (-310p/-a5 auto-appended for FROM and the omni tag base)'
        type: string
        default: 'v0.23.0-main'
      omni_image:
        description: 'Target image repo for vllm-omni'
        type: string
        default: 'quay.io/fayeomni/vllm-omni'

permissions:
  contents: read

jobs:
  prep:
    name: Resolve tags
    runs-on: ubuntu-latest
    outputs:
      omni_tag_base: ${{ steps.vars.outputs.omni_tag_base }}
    steps:
      - name: Compute
        id: vars
        env:
          OMNI_REF: ${{ inputs.omni_ref }}
          BASE_TAG: ${{ inputs.vllm_ascend_base_tag }}
        run: |
          set -euo pipefail
          # Same ref normalization as build_images.yaml: PR refs become pr<N>,
          # full SHAs shrink to 8 chars, everything else uses its basename.
          norm() {
            local ref="$1"
            if [[ "$ref" =~ ^refs/pull/([0-9]+)/(head|merge)$ ]]; then
              echo "pr${BASH_REMATCH[1]}"
            elif [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "${ref:0:8}"
            else
              echo "${ref##*/}"
            fi
          }
          echo "omni_tag_base=${BASE_TAG}-omni-$(norm "$OMNI_REF")" >> "$GITHUB_OUTPUT"

  omni:
    name: vllm-omni (${{ matrix.variant.key }})
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        variant:
          - dockerfile: docker/vllm-omni/Dockerfile.npu.ci.310p
            suffix: '-310p'
            key: omni-310p
          - dockerfile: docker/vllm-omni/Dockerfile.npu.ci.a5
            suffix: '-a5'
            key: omni-a5
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      # The Dockerfiles live in this repo and clone vllm-omni at build time,
      # so this repo (at the dispatch ref) is the checkout and build context.
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      dockerfile: ${{ matrix.variant.dockerfile }}
      image: ${{ inputs.omni_image }}
      image_tag: ${{ needs.prep.outputs.omni_tag_base }}${{ matrix.variant.suffix }}
      artifact_key: ${{ matrix.variant.key }}
      build_args: |
        VLLM_ASCEND_IMAGE=${{ inputs.vllm_ascend_image }}
        VLLM_ASCEND_TAG=${{ inputs.vllm_ascend_base_tag }}${{ matrix.variant.suffix }}
        VLLM_OMNI_REF=${{ inputs.omni_ref }}
    secrets: inherit
