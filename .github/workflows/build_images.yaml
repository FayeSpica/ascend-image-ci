# Manually triggered orchestrator that builds vllm-ascend and/or vllm-omni
# NPU images from their upstream source repos and pushes multi-arch manifests
# to quay.io/fayeomni/*.
#
# Dependency chain: vllm-omni's NPU image is built FROM the vllm-ascend image
# (FROM ${VLLM_ASCEND_IMAGE}:${VLLM_ASCEND_TAG}), so when both are selected the
# omni build runs after the ascend build and uses the freshly built tag as its
# base. To build omni alone against an existing ascend image, leave ascend
# unselected and set `vllm_ascend_base_tag`.
#
# Published tags (suffix '-a3' for the A3 variant):
#   vllm-ascend: <vllm_tag>-<ascend_ref>[-a3]
#   vllm-omni:   <vllm_tag>-<ascend_ref>-omni-<omni_ref>[-a3]
name: Build Ascend/Omni images

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which images to build'
        type: choice
        default: 'ascend+omni'
        options:
          - ascend+omni
          - ascend
          - omni
      vllm_tag:
        description: 'vLLM tag/branch (VLLM_TAG build-arg, git clone -b). Ignored when vllm_commit is set. A pre-tag release branch like releases/v0.24.0 is allowed; the published image tag uses the branch basename (v0.24.0). A full 40-char SHA here is also accepted and treated as vllm_commit.'
        type: string
        default: 'v0.23.0'
      vllm_commit:
        description: 'vLLM commit SHA to build (full 40-char, VLLM_COMMIT build-arg, git fetch <sha>). Use this for a bare commit that git clone -b cannot check out. Takes precedence over vllm_tag; the tag fragment uses the first 8 chars. Empty = build from vllm_tag.'
        type: string
        default: ''
      ascend_ref:
        description: 'vllm-ascend ref to checkout (branch/tag/commit, or a PR ref like refs/pull/11709/head)'
        type: string
        default: 'main'
      omni_ref:
        description: 'vllm-omni ref to checkout (branch/tag/commit, or a PR ref like refs/pull/123/head)'
        type: string
        default: 'main'
      vllm_ascend_base_tag:
        description: 'Existing vllm-ascend tag to use as omni base (omni-only builds). Empty = use freshly built ascend tag.'
        type: string
        default: ''
      vllm_ascend_image:
        description: 'Base image repo for omni FROM (suffix -a3 auto-appended to its tag)'
        type: string
        default: 'quay.io/fayeomni/vllm-ascend'
      omni_image:
        description: 'Target image repo for vllm-omni'
        type: string
        default: 'quay.io/fayeomni/vllm-omni'
      omni_tag:
        description: 'Override omni tag base (suffix -a3 auto-appended). Empty = <vllm_tag>-<ascend_ref>-omni-<omni_ref>'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prep:
    name: Resolve targets and tags
    runs-on: ubuntu-latest
    outputs:
      build_ascend: ${{ steps.vars.outputs.build_ascend }}
      build_omni: ${{ steps.vars.outputs.build_omni }}
      ascend_tag: ${{ steps.vars.outputs.ascend_tag }}
      omni_tag: ${{ steps.vars.outputs.omni_tag }}
      omni_base_tag: ${{ steps.vars.outputs.omni_base_tag }}
      vllm_commit: ${{ steps.vars.outputs.vllm_commit }}
    steps:
      - name: Compute
        id: vars
        env:
          TARGETS: ${{ inputs.targets }}
          VLLM_TAG: ${{ inputs.vllm_tag }}
          VLLM_COMMIT_IN: ${{ inputs.vllm_commit }}
          ASCEND_REF: ${{ inputs.ascend_ref }}
          OMNI_REF: ${{ inputs.omni_ref }}
          BASE_TAG: ${{ inputs.vllm_ascend_base_tag }}
          OMNI_TAG_IN: ${{ inputs.omni_tag }}
        run: |
          set -euo pipefail
          # Normalize a git ref into a docker-tag-safe fragment. The raw inputs
          # are still used verbatim for checkout / VLLM_TAG build-arg, so this
          # only affects the published tag:
          #   refs/pull/<N>/head|merge -> pr<N>   (a PR ref's basename is the
          #                                        useless 'head'/'merge')
          #   <40-char hex SHA>        -> first 8 chars (full SHA bloats the tag)
          #   otherwise                -> basename (strip up to last '/'), which
          #                               drops the 'releases/' prefix and the
          #                               '/' that is illegal in docker tags, so
          #                               releases/v0.24.0 publishes as v0.24.0.
          norm() {
            local ref="$1"
            if [[ "$ref" =~ ^refs/pull/([0-9]+)/(head|merge)$ ]]; then
              echo "pr${BASH_REMATCH[1]}"
            elif [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "${ref:0:8}"
            else
              echo "${ref##*/}"
            fi
          }
          A="$(norm "$ASCEND_REF")"
          O="$(norm "$OMNI_REF")"

          # Resolve the vLLM commit. A bare SHA can't be cloned with
          # `git clone -b` (the vllm-ascend Dockerfile's default path) — it fails
          # with "Remote branch <sha> not found". The Dockerfile routes
          # VLLM_COMMIT through `git fetch <sha>` instead. Precedence: the
          # explicit vllm_commit input wins; otherwise a full 40-char SHA passed
          # in vllm_tag is treated as a commit too. VLLM_COMMIT must be a full SHA
          # (git can't fetch a partial one), so reject anything else early.
          COMMIT="$VLLM_COMMIT_IN"
          if [[ -z "$COMMIT" && "$VLLM_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT="$VLLM_TAG"
          fi
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::vllm_commit must be a full 40-char SHA (got '${COMMIT}'); git fetch cannot resolve a partial SHA." >&2
            exit 1
          fi
          echo "vllm_commit=${COMMIT}" >> "$GITHUB_OUTPUT"

          # Tag fragment: short commit when building from a commit, else the
          # normalized vllm_tag basename.
          if [[ -n "$COMMIT" ]]; then
            V="${COMMIT:0:8}"
          else
            V="$(norm "$VLLM_TAG")"
          fi

          if [[ "$TARGETS" == *ascend* ]]; then echo "build_ascend=true"; else echo "build_ascend=false"; fi >> "$GITHUB_OUTPUT"
          if [[ "$TARGETS" == *omni* ]];   then echo "build_omni=true";   else echo "build_omni=false";   fi >> "$GITHUB_OUTPUT"

          ASCEND_TAG="${V}-${A}"
          echo "ascend_tag=${ASCEND_TAG}" >> "$GITHUB_OUTPUT"

          if [[ -n "$OMNI_TAG_IN" ]]; then
            echo "omni_tag=${OMNI_TAG_IN}" >> "$GITHUB_OUTPUT"
          else
            echo "omni_tag=${ASCEND_TAG}-omni-${O}" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$BASE_TAG" ]]; then
            echo "omni_base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "omni_base_tag=${ASCEND_TAG}" >> "$GITHUB_OUTPUT"
          fi

  ascend:
    name: vllm-ascend
    needs: prep
    if: ${{ needs.prep.outputs.build_ascend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - dockerfile: Dockerfile
            suffix: ''
            key: ascend-a2
          - dockerfile: Dockerfile.a3
            suffix: '-a3'
            key: ascend-a3
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      source_repo: vllm-project/vllm-ascend
      source_ref: ${{ inputs.ascend_ref }}
      dockerfile: ${{ matrix.variant.dockerfile }}
      image: quay.io/fayeomni/vllm-ascend
      image_tag: ${{ needs.prep.outputs.ascend_tag }}${{ matrix.variant.suffix }}
      artifact_key: ${{ matrix.variant.key }}
      build_args: |
        VLLM_TAG=${{ inputs.vllm_tag }}
        VLLM_COMMIT=${{ needs.prep.outputs.vllm_commit }}
    secrets: inherit

  omni:
    name: vllm-omni
    needs: [prep, ascend]
    # run when omni is selected and ascend either succeeded or was skipped
    # (omni-only build against an existing base tag)
    if: ${{ always() && needs.prep.outputs.build_omni == 'true' && (needs.ascend.result == 'success' || needs.ascend.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - dockerfile: docker/Dockerfile.npu
            suffix: ''
            key: omni-a2
          - dockerfile: docker/Dockerfile.npu.a3
            suffix: '-a3'
            key: omni-a3
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      source_repo: vllm-project/vllm-omni
      source_ref: ${{ inputs.omni_ref }}
      dockerfile: ${{ matrix.variant.dockerfile }}
      image: ${{ inputs.omni_image }}
      image_tag: ${{ needs.prep.outputs.omni_tag }}${{ matrix.variant.suffix }}
      artifact_key: ${{ matrix.variant.key }}
      build_args: |
        VLLM_ASCEND_IMAGE=${{ inputs.vllm_ascend_image }}
        VLLM_ASCEND_TAG=${{ needs.prep.outputs.omni_base_tag }}${{ matrix.variant.suffix }}
    secrets: inherit
