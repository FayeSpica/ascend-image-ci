# Manually triggered job to patch an already-built multi-arch image by building
# MindIE-SD from source and installing the wheel, then re-publishing under a
# new tag.
#
# MindIE-SD is not on PyPI, so it has to be cloned from gitcode and built with
# `python setup.py bdist_wheel`. Its tik_ops build step is commented out first
# (not needed here, and it dominates build time) — see patch/build-mindie-sd.sh.
#
# Multi-arch is handled by reusing _build_push_image.yaml: it builds each arch on
# its native runner, pushes per-arch tags, merges them into one manifest, and
# prunes the interim tags. The patch itself is patch/Dockerfile.mindie-sd.
#
# Required configuration (repo Settings -> Secrets and variables -> Actions):
#   Variable QUAY_USERNAME / Secret QUAY_PASSWORD -> read source + write dest
#   Secret QUAY_OAUTH_TOKEN (optional)            -> prune interim per-arch tags
name: Patch image (MindIE-SD)

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source multi-arch image to patch'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main'
      dest_image:
        description: 'Destination image (full ref incl. tag) for the patched image'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main-mindiesd'
      mindie_sd_repo:
        description: 'MindIE-SD git repo to clone'
        required: false
        type: string
        default: 'https://gitcode.com/Ascend/MindIE-SD.git'
      mindie_sd_ref:
        description: 'MindIE-SD ref (branch/tag/commit); empty = default branch'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prep:
    name: Resolve destination
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.split.outputs.image }}
      tag: ${{ steps.split.outputs.tag }}
    steps:
      - name: Split dest_image into repo and tag
        id: split
        env:
          DST: ${{ inputs.dest_image }}
        run: |
          set -euo pipefail
          # A tag is the colon after the last '/'. Require one so we never
          # mistake a registry port (host:5000/repo) for the tag.
          name="${DST##*/}"
          if [[ "$name" != *:* ]]; then
            echo "::error::dest_image must include a tag, e.g. quay.io/ns/repo:tag (got '${DST}')."
            exit 1
          fi
          echo "image=${DST%:*}" >> "$GITHUB_OUTPUT"   # everything before the last ':'
          echo "tag=${DST##*:}" >> "$GITHUB_OUTPUT"     # everything after the last ':'

  patch:
    name: Build MindIE-SD and re-publish
    needs: prep
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      # Build context is THIS repo (holds patch/Dockerfile.mindie-sd and the
      # build script); the image being patched comes in via BASE_IMAGE / FROM.
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      dockerfile: patch/Dockerfile.mindie-sd
      image: ${{ needs.prep.outputs.image }}
      image_tag: ${{ needs.prep.outputs.tag }}
      artifact_key: patch-mindie-sd
      build_args: |
        BASE_IMAGE=${{ inputs.source_image }}
        MINDIE_SD_REPO=${{ inputs.mindie_sd_repo }}
        MINDIE_SD_REF=${{ inputs.mindie_sd_ref }}
    secrets: inherit
