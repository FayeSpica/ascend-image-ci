# Manually triggered job to patch an already-built multi-arch image by
# installing a prebuilt MindIE-SD wheel, then re-publishing under a new tag.
#
# MindIE-SD is not on PyPI, so wheels are prebuilt and hosted as GitHub Release
# assets rather than vendored in the repo, and downloaded at image-build time
# (see patch/Dockerfile.mindie-sd). The patched image differs from its source by
# a single pip-install layer.
#
# Both arches are built so the destination stays a multi-arch manifest matching
# the source. Only an aarch64 wheel is published today, so the amd64 build skips
# the install instead of failing; set wheel_url_x86_64 once one exists.
#
# Multi-arch is handled by reusing _build_push_image.yaml: it builds each arch on
# its native runner, pushes per-arch tags, merges them into one manifest, and
# prunes the interim tags.
#
# Required configuration (repo Settings -> Secrets and variables -> Actions):
#   Variable QUAY_USERNAME / Secret QUAY_PASSWORD -> read source + write dest
#   Secret QUAY_OAUTH_TOKEN (optional)            -> prune interim per-arch tags
name: Patch image (MindIE-SD)

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source multi-arch image to patch'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main'
      dest_image:
        description: 'Destination image (full ref incl. tag) for the patched image'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main-mindiesd'
      wheel_url_aarch64:
        description: 'MindIE-SD wheel URL for arm64'
        required: false
        type: string
        default: 'https://github.com/FayeSpica/ascend-image-ci/releases/download/mindiesd-3.0.0/mindiesd-3.0.0-cp312-cp312-linux_aarch64.whl'
      wheel_url_x86_64:
        description: 'MindIE-SD wheel URL for amd64; leave empty to skip the install there'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prep:
    name: Resolve destination
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.split.outputs.image }}
      tag: ${{ steps.split.outputs.tag }}
    steps:
      - name: Split dest_image into repo and tag
        id: split
        env:
          DST: ${{ inputs.dest_image }}
        run: |
          set -euo pipefail
          # A tag is the colon after the last '/'. Require one so we never
          # mistake a registry port (host:5000/repo) for the tag.
          name="${DST##*/}"
          if [[ "$name" != *:* ]]; then
            echo "::error::dest_image must include a tag, e.g. quay.io/ns/repo:tag (got '${DST}')."
            exit 1
          fi
          echo "image=${DST%:*}" >> "$GITHUB_OUTPUT"   # everything before the last ':'
          echo "tag=${DST##*:}" >> "$GITHUB_OUTPUT"     # everything after the last ':'

  patch:
    name: Install MindIE-SD and re-publish
    needs: prep
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      # Build context is THIS repo (holds patch/Dockerfile.mindie-sd); the image
      # being patched comes in via BASE_IMAGE / FROM, and the wheel is fetched
      # from its release URL inside the build.
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      dockerfile: patch/Dockerfile.mindie-sd
      image: ${{ needs.prep.outputs.image }}
      image_tag: ${{ needs.prep.outputs.tag }}
      artifact_key: patch-mindie-sd
      build_args: |
        BASE_IMAGE=${{ inputs.source_image }}
        MINDIE_SD_WHEEL_URL_AARCH64=${{ inputs.wheel_url_aarch64 }}
        MINDIE_SD_WHEEL_URL_X86_64=${{ inputs.wheel_url_x86_64 }}
    secrets: inherit
