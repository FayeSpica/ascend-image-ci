# Manually triggered job to patch an already-built multi-arch image by
# uninstalling pip package(s) from it, then re-publishing under a new tag.
#
# Motivation: mooncake-transfer-engine-npu's native library aborts (SIGABRT) on
# import in some environments, which crashes vllm-ascend model inspection.
# Removing the package sidesteps it without rebuilding the whole image.
#
# Multi-arch is handled by reusing _build_push_image.yaml: it builds each arch on
# its native runner (so the `pip uninstall` RUN executes natively, no QEMU),
# pushes per-arch tags, merges them into one manifest, and prunes the interim
# tags. The patch itself lives in patch/Dockerfile.pip-uninstall.
#
# Required configuration (repo Settings -> Secrets and variables -> Actions):
#   Variable QUAY_USERNAME / Secret QUAY_PASSWORD -> read source + write dest
#   Secret QUAY_OAUTH_TOKEN (optional)            -> prune interim per-arch tags
name: Patch image (pip uninstall)

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source multi-arch image to patch'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main'
      dest_image:
        description: 'Destination image (full ref incl. tag) for the patched image'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main-nomooncake'
      packages:
        description: 'Space-separated pip packages to uninstall'
        required: false
        type: string
        default: 'mooncake-transfer-engine-npu'

permissions:
  contents: read

jobs:
  prep:
    name: Resolve destination
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.split.outputs.image }}
      tag: ${{ steps.split.outputs.tag }}
    steps:
      - name: Split dest_image into repo and tag
        id: split
        env:
          DST: ${{ inputs.dest_image }}
        run: |
          set -euo pipefail
          # A tag is the colon after the last '/'. Require one so we never
          # mistake a registry port (host:5000/repo) for the tag.
          name="${DST##*/}"
          if [[ "$name" != *:* ]]; then
            echo "::error::dest_image must include a tag, e.g. quay.io/ns/repo:tag (got '${DST}')."
            exit 1
          fi
          echo "image=${DST%:*}" >> "$GITHUB_OUTPUT"   # everything before the last ':'
          echo "tag=${DST##*:}" >> "$GITHUB_OUTPUT"     # everything after the last ':'

  patch:
    name: Uninstall and re-publish
    needs: prep
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      # Build context is THIS repo (holds patch/Dockerfile.pip-uninstall); the
      # image being patched comes in via the BASE_IMAGE build-arg / FROM.
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      dockerfile: patch/Dockerfile.pip-uninstall
      image: ${{ needs.prep.outputs.image }}
      image_tag: ${{ needs.prep.outputs.tag }}
      artifact_key: patch-pip-uninstall
      build_args: |
        BASE_IMAGE=${{ inputs.source_image }}
        PIP_UNINSTALL=${{ inputs.packages }}
    secrets: inherit
