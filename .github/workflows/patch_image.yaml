# Manually triggered job to patch an already-built multi-arch image by baking a
# global LD_PRELOAD (libjemalloc) into it, then re-publishing under a new tag.
#
# Motivation: the vllm-ascend base only sets LD_PRELOAD in ~/.bashrc, so it
# applies to login shells but not the vllm server process. Setting it as a
# Docker ENV makes jemalloc preload globally. The value is referenced by soname
# so a single static value works on both amd64 and arm64 (see the Dockerfile).
#
# Multi-arch is handled by reusing _build_push_image.yaml: it builds each arch on
# its native runner, pushes per-arch tags, merges them into one manifest, and
# prunes the interim tags. The patch itself is patch/Dockerfile.ld-preload.
#
# Required configuration (repo Settings -> Secrets and variables -> Actions):
#   Variable QUAY_USERNAME / Secret QUAY_PASSWORD -> read source + write dest
#   Secret QUAY_OAUTH_TOKEN (optional)            -> prune interim per-arch tags
name: Patch image (LD_PRELOAD)

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source multi-arch image to patch'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main'
      dest_image:
        description: 'Destination image (full ref incl. tag) for the patched image'
        required: true
        type: string
        default: 'quay.io/fayeomni/vllm-ascend:v0.23.0-main-jemalloc'

permissions:
  contents: read

jobs:
  prep:
    name: Resolve destination
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.split.outputs.image }}
      tag: ${{ steps.split.outputs.tag }}
    steps:
      - name: Split dest_image into repo and tag
        id: split
        env:
          DST: ${{ inputs.dest_image }}
        run: |
          set -euo pipefail
          # A tag is the colon after the last '/'. Require one so we never
          # mistake a registry port (host:5000/repo) for the tag.
          name="${DST##*/}"
          if [[ "$name" != *:* ]]; then
            echo "::error::dest_image must include a tag, e.g. quay.io/ns/repo:tag (got '${DST}')."
            exit 1
          fi
          echo "image=${DST%:*}" >> "$GITHUB_OUTPUT"   # everything before the last ':'
          echo "tag=${DST##*:}" >> "$GITHUB_OUTPUT"     # everything after the last ':'

  patch:
    name: Bake LD_PRELOAD and re-publish
    needs: prep
    uses: ./.github/workflows/_build_push_image.yaml
    with:
      # Build context is THIS repo (holds patch/Dockerfile.ld-preload); the
      # image being patched comes in via the BASE_IMAGE build-arg / FROM.
      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      dockerfile: patch/Dockerfile.ld-preload
      image: ${{ needs.prep.outputs.image }}
      image_tag: ${{ needs.prep.outputs.tag }}
      artifact_key: patch-ld-preload
      build_args: |
        BASE_IMAGE=${{ inputs.source_image }}
    secrets: inherit
