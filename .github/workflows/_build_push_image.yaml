# Reusable workflow: build a single image from an external source repo for
# both amd64 + arm64 on native runners, push by digest, then merge into one
# multi-arch manifest tag.
#
# Credentials: the caller must pass `secrets: inherit`. The repo variable
# QUAY_USERNAME and secret QUAY_PASSWORD are used to log in to quay.io.
name: _build_push_image

on:
  workflow_call:
    inputs:
      source_repo:
        description: 'GitHub repo to checkout as build context (owner/name)'
        required: true
        type: string
      source_ref:
        description: 'Ref (branch/tag/commit) of source_repo to build'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile within source_repo'
        required: true
        type: string
      image:
        description: 'Target image name (e.g. quay.io/fayeomni/vllm-ascend)'
        required: true
        type: string
      image_tag:
        description: 'Full image tag to publish (suffix already included)'
        required: true
        type: string
      artifact_key:
        description: 'Unique key to namespace digest artifacts across calls'
        required: true
        type: string
      build_args:
        description: 'Newline-separated docker build args'
        required: false
        type: string
        default: ''
      build_context:
        description: 'Build context path within the checked-out source'
        required: false
        type: string
        default: '.'
      max_jobs:
        description: 'If set, inject ENV MAX_JOBS=<n> after every FROM to cap compile parallelism (setup.py reads MAX_JOBS). Use for variants whose kernel builds OOM the runner.'
        required: false
        type: string
        default: ''
      patches:
        description: 'Optional comma-separated PR numbers against source_repo to apply as a temporary patch before building (each fetched from https://github.com/<source_repo>/pull/<n>.diff and git-applied to the checkout). Empty = no patch.'
        required: false
        type: string
        default: ''
    secrets:
      QUAY_PASSWORD:
        description: 'Quay password/token for pushing images'
        required: true
      QUAY_OAUTH_TOKEN:
        description: 'Quay OAuth token (delete perms) to prune interim per-arch tags after merge. Optional; cleanup is skipped when unset.'
        required: false

jobs:
  build-push:
    name: build ${{ inputs.artifact_key }} (${{ matrix.arch.tag }})
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.artifact_key == 'ascend-a5' && 1 || 2 }}
      matrix:
        arch:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
    steps:
      - name: Checkout ${{ inputs.source_repo }}@${{ inputs.source_ref }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          # vllm-ascend's build_aclnn.sh needs the catlass submodule sources in
          # the build context: it only falls back to `git submodule update`
          # when csrc/third_party/catlass is missing, and that fallback always
          # fails because .dockerignore excludes .git/.
          submodules: recursive

      # Optional temporary patch: bake an upstream PR's diff into the checked-out
      # source before the build. Each PR number is resolved against source_repo
      # (github.com/<source_repo>/pull/<n>.diff) and applied with git apply. The
      # build aborts loudly if a patch does not apply cleanly.
      - name: Apply temporary patches
        if: ${{ inputs.patches != '' }}
        env:
          SRC_REPO: ${{ inputs.source_repo }}
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          # Accept a comma- or newline-separated list (the YAML string arrives as
          # a single line; split on comma). Trim whitespace per entry.
          IFS=',' read -ra nums <<< "${PATCHES}"
          for n in "${nums[@]}"; do
            n="$(printf '%s' "$n" | tr -d '[:space:]')"
            [[ -z "$n" ]] && continue
            url="https://github.com/${SRC_REPO}/pull/${n}.diff"
            echo "Applying temporary patch: ${url}"
            curl -fsSL "${url}" | git apply -v -
            echo "Applied ${url}"
          done

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Some variants (e.g. Ascend 950/a5) compile enough custom kernels to
      # exhaust the GitHub-hosted runner's memory at full nproc parallelism,
      # which kills the runner mid-build ("runner has received a shutdown
      # signal"). vllm-ascend's setup.py reads MAX_JOBS from the environment,
      # so inject an ENV into the Dockerfile to cap compile parallelism.
      - name: Cap build parallelism (MAX_JOBS=${{ inputs.max_jobs }})
        if: ${{ inputs.max_jobs != '' }}
        run: |
          set -euo pipefail
          sed -i '/^FROM /a ENV MAX_JOBS=${{ inputs.max_jobs }}' "${{ inputs.dockerfile }}"
          grep -n 'MAX_JOBS' "${{ inputs.dockerfile }}"

      # Push to a per-arch tag (not push-by-digest): Quay garbage-collects
      # untagged digests, which can race with slow builds and break the merge.
      # These interim per-arch tags are pruned by the merge job after the
      # multi-arch manifest is created (see "Delete per-arch tags").
      - name: Build and push per-arch tag
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.arch.platform }}
          push: true
          provenance: false
          tags: ${{ inputs.image }}:${{ inputs.image_tag }}-${{ matrix.arch.tag }}
          build-args: ${{ inputs.build_args }}

  merge:
    name: merge ${{ inputs.artifact_key }}
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
    steps:
      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge and push multi-arch manifest
        env:
          TAG: ${{ inputs.image }}:${{ inputs.image_tag }}
        run: |
          docker buildx imagetools create -t "${TAG}" \
            "${TAG}-amd64" \
            "${TAG}-arm64"
          docker buildx imagetools inspect "${TAG}"

      # Prune the interim per-arch tags now that the multi-arch manifest
      # references their digests. Uses Quay's REST API so only these two tag
      # pointers are removed and nothing is baked into any image: a v2 registry
      # DELETE by digest (what `skopeo delete` does) would drop the shared child
      # manifest and break the list, and a quay.expires-after label would be
      # inherited by FROM-derived and retagged images. The digests survive
      # because the manifest list references them.
      - name: Delete per-arch tags
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          QUAY_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${QUAY_TOKEN:-}" ]]; then
            echo "QUAY_OAUTH_TOKEN not set; skipping per-arch tag cleanup."
            exit 0
          fi
          # API path uses <namespace>/<repo> without the registry host.
          repo="${IMAGE#quay.io/}"
          for arch in amd64 arm64; do
            tag="${IMAGE_TAG}-${arch}"
            echo "Deleting tag ${repo}:${tag}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${QUAY_TOKEN}" \
              "https://quay.io/api/v1/repository/${repo}/tag/${tag}")
            if [[ "$code" == "204" || "$code" == "200" ]]; then
              echo "Deleted ${repo}:${tag}"
            else
              echo "::warning::Failed to delete ${repo}:${tag} (HTTP ${code})"
            fi
          done
