# Matrix: Omni da572cddb. Select source and base image once in env below.
# Shared cap: 4 jobs x at most 4 cards = at most 16 allocated cards, across builds.
env:
  OMNI_REPO: https://github.com/FayeSpica/vllm-omni.git
  OMNI_COMMIT: a3937ed027ffaa590029174b3571eebd10ce56e6
  TEST_IMAGE: &id001 swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}-${BUILDKITE_BUILD_NUMBER}-a3
  VLLM_ASCEND_IMAGE: quay.io/fayeomni/vllm-ascend
  VLLM_ASCEND_VERSION: v0.32.0-1cebee70
  BUILDKITD_ADDR: tcp://buildkitd-service.buildkitd:1234
steps:
- label: Build Omni Dockerfile.npu.ci - A3
  key: image-build-a3
  agents:
    queue: ascend-a3-offload-test
    resource_class: npu-2
  timeout_in_minutes: 120
  plugins:
  - kubernetes:
      metadata:
        annotations:
          vault.hashicorp.com/agent-init-first: 'true'
          vault.hashicorp.com/agent-inject: 'true'
          vault.hashicorp.com/agent-inject-perms-ca.pem: '0400'
          vault.hashicorp.com/agent-inject-perms-cert.pem: '0400'
          vault.hashicorp.com/agent-inject-perms-config.json: '0400'
          vault.hashicorp.com/agent-inject-perms-key.pem: '0400'
          vault.hashicorp.com/agent-inject-secret-ca.pem: internal/data/ascend/buildkitd
          vault.hashicorp.com/agent-inject-secret-cert.pem: internal/data/ascend/buildkitd
          vault.hashicorp.com/agent-inject-secret-config.json: internal/data/ascend/buildkitd
          vault.hashicorp.com/agent-inject-secret-key.pem: internal/data/ascend/buildkitd
          vault.hashicorp.com/agent-inject-template-ca.pem: '{{- with secret "internal/data/ascend/buildkitd" -}}

            {{ .Data.data.RootCA }}

            {{- end }}'
          vault.hashicorp.com/agent-inject-template-cert.pem: '{{- with secret "internal/data/ascend/buildkitd"
            -}}

            {{ .Data.data.ClientCaCert }}

            {{- end }}'
          vault.hashicorp.com/agent-inject-template-config.json: '{{- with secret "internal/data/ascend/buildkitd"
            -}}

            {{ .Data.data.dockerConfig }}

            {{- end }}'
          vault.hashicorp.com/agent-inject-template-key.pem: '{{- with secret "internal/data/ascend/buildkitd" -}}

            {{ .Data.data.ClientCaKey }}

            {{- end }}'
          vault.hashicorp.com/agent-pre-populate-only: 'true'
          vault.hashicorp.com/agent-run-as-group: '1000'
          vault.hashicorp.com/agent-run-as-user: '1000'
          vault.hashicorp.com/agent-service-account-token-volume-name: token-vol
          vault.hashicorp.com/role: ascend-gha-runners
          vault.hashicorp.com/secret-volume-path: /home/user/.docker/
      podSpecPatch:
        volumes:
        - name: token-vol
          projected:
            defaultMode: 420
            sources:
            - serviceAccountToken:
                audience: api
                expirationSeconds: 600
                path: token
  command: bash .buildkite/scripts/build-omni-a3.sh
  concurrency: 4
  concurrency_group: ascend-image-ci/omni-ready-a3
  concurrency_method: ordered
- label: Platforms Test
  key: a3-ready-1
  agents:
    queue: ascend-a3-offload-test
    resource_class: npu-2
  image: *id001
  plugins:
  - kubernetes:
      podSpecPatch:
        imagePullSecrets:
        - name: swr-secret
  env:
    VLLM_TARGET_DEVICE: npu
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  timeout_in_minutes: 60
  command: "export PS1=x\nsource /root/.bashrc\nset -euo pipefail\nexport VLLM_TARGET_DEVICE=npu\nexport VLLM_WORKER_MULTIPROC_METHOD=spawn\n\
    if [[ -n \"$${OMNI_SOURCE_DIR:-}\" ]]; then\n  cd \"$$OMNI_SOURCE_DIR\"\nelse\n  cd \"$$(python3 -c 'from importlib.util\
    \ import find_spec; from pathlib import Path; print(Path(find_spec(\"vllm_omni\").origin).resolve().parent.parent)')\"\
    \nfi\ntest \"$$(git rev-parse HEAD)\" = \"$$OMNI_COMMIT\"\ngit diff --exit-code\npython3 -c \"import tbe, torch_npu,\
    \ vllm_omni; print(vllm_omni.__file__)\"\nnpu-smi info\npytest -s -v tests/platforms/npu/test_minicpmo_code2wav_npugraph.py\
    \ tests/platforms/npu/test_contiguous_kv_cache.py tests/platforms/npu/test_npu_device_copy.py -m 'core_model\
    \ and npu and A3 and omni' --run-level 'core_model'\n"
  depends_on: image-build-a3
  concurrency: 4
  concurrency_group: ascend-image-ci/omni-ready-a3
  concurrency_method: ordered
