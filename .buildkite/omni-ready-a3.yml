    \ vllm_omni; print(vllm_omni.__file__)\"\nnpu-smi info\npytest -s -v tests/diffusion/layers/test_activation.py\
    \ tests/diffusion/layers/test_fused_qk_norm_rope_npu.py tests/diffusion/models/minimax_h3/test_minimax_h3_qwen3vl_swiglu.py\
    \ tests/diffusion/models/minimax_h3/test_minimax_h3_modulation.py -m 'core_model and npu and A3' --run-level\
