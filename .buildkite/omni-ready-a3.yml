# Source matrix: Omni da572cddb .buildkite/npu/test-npu-ready.yml
# Image source: Ascend 1cebee70 + Omni a3937ed0 (includes MoE compatibility patch).
steps:
- label: Platforms Test
  key: a3-ready-1
  agents:
    queue: ascend-a3-offload-test
    resource_class: npu-2
  image: quay.nju.edu.cn/fayeomni/vllm-omni:v0.32.0-1cebee70-a3937ed0-a3
  plugins:
  - kubernetes:
      podSpecPatch:
        imagePullSecrets:
        - name: swr-secret
  env:
    VLLM_TARGET_DEVICE: npu
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  timeout_in_minutes: 60
  command: 'export PS1=x

    source /root/.bashrc

    set -euo pipefail

    export VLLM_TARGET_DEVICE=npu

    export VLLM_WORKER_MULTIPROC_METHOD=spawn

    cd /vllm-workspace/vllm-omni

    test "$$(git rev-parse HEAD)" = a3937ed027ffaa590029174b3571eebd10ce56e6

    git diff --exit-code

    python3 -c "import tbe, torch_npu, vllm_omni; print(vllm_omni.__file__)"

    npu-smi info

    pytest -s -v tests/platforms/npu/test_minicpmo_code2wav_npugraph.py tests/platforms/npu/test_contiguous_kv_cache.py
    tests/platforms/npu/test_npu_device_copy.py -m ''core_model and npu and A3 and omni'' --run-level ''core_model''

    '
